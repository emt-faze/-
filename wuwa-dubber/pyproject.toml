[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "wuwa-ai-dubber"
version = "0.5.0"
description = "Local OCR and character dubbing with sentence caching and progressive playback"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
ui = ["PySide6>=6.7,<7"]
ocr = ["rapidocr-onnxruntime>=1.3.24,<2", "opencv-python>=4.10,<5"]
capture = ["windows-capture>=1.4,<2", "opencv-python>=4.10,<5", "pywin32>=306"]
audio = ["numpy>=1.26,<3", "sounddevice>=0.5,<1"]
hotkeys = ["pynput>=1.7.7,<2"]
all = [
  "PySide6>=6.7,<7",
  "rapidocr-onnxruntime>=1.3.24,<2",
  "opencv-python>=4.10,<5",
  "windows-capture>=1.4,<2",
  "pywin32>=306",
  "numpy>=1.26,<3",
  "sounddevice>=0.5,<1",
  "pynput>=1.7.7,<2",
]
dev = ["pytest>=8,<9"]

[project.scripts]
wuwa-dubber = "wuwa_dubber.__main__:main"
wuwa-tts-worker = "wuwa_dubber.tts.worker:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
